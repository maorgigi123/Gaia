name: gaia
services:
  oracle:
    image: container-registry.oracle.com/database/free:23.26.3.0-lite-arm64
    platform: linux/arm64
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD in .env}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD:?Set ORACLE_APP_PASSWORD in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle:/opt/oracle/scripts/startup:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/oracle/oradata/.gaia-user-ready && /opt/oracle/checkDBStatus.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  oracle-data:
